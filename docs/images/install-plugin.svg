<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">在 DSH 插件页安装 dsh-system-proxy</title>
  <desc id="desc">示意图：打开添加插件，输入 dsh-system-proxy@0.1.1，然后点击安装。</desc>
  <rect width="1200" height="610" fill="#eef1f4"/>
  <rect x="44" y="34" width="1112" height="542" rx="14" fill="#ffffff" stroke="#d5dce3"/>
  <rect x="44" y="34" width="230" height="542" rx="14" fill="#f7f9fb"/>
  <path d="M274 34v542" stroke="#e1e6eb"/>
  <circle cx="79" cy="75" r="17" fill="#2257d7"/>
  <path d="M72 75l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#18212b">DeepSeek Harness</text>
  <rect x="66" y="122" width="186" height="42" rx="8" fill="#e8eefc"/>
  <text x="91" y="149" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#2257d7">插件</text>
  <text x="91" y="200" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#66717d">已安装</text>
  <text x="91" y="241" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#66717d">发现</text>
  <text x="91" y="282" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#66717d">设置</text>
  <text x="308" y="91" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#18212b">插件</text>
  <text x="308" y="123" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#66717d">管理 DSH 的扩展能力</text>
  <rect x="879" y="69" width="230" height="42" rx="8" fill="#2257d7"/>
  <text x="949" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#ffffff">+ 添加插件</text>
  <rect x="308" y="152" width="801" height="88" rx="10" fill="#f8fafc" stroke="#e1e6eb"/>
  <text x="332" y="184" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#25313d">安装来源</text>
  <text x="332" y="213" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#6b7681">输入 npm 包名，或粘贴 GitHub 仓库地址</text>
  <rect x="308" y="264" width="801" height="78" rx="10" fill="#ffffff" stroke="#cad3dc"/>
  <text x="332" y="310" font-family="Consolas, monospace" font-size="19" fill="#1c2733">dsh-system-proxy@0.1.1</text>
  <rect x="972" y="280" width="112" height="46" rx="8" fill="#2257d7"/>
  <text x="1007" y="309" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#ffffff">安装</text>
  <rect x="308" y="370" width="801" height="126" rx="10" fill="#f8fafc" stroke="#e1e6eb"/>
  <circle cx="342" cy="408" r="11" fill="#dce6ff"/>
  <text x="338" y="413" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2257d7">1</text>
  <text x="370" y="414" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#25313d">点击右侧“安装”，等待依赖下载完成</text>
  <circle cx="342" cy="449" r="11" fill="#dce6ff"/>
  <text x="338" y="454" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2257d7">2</text>
  <text x="370" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#25313d">完全退出 DSH，再重新打开</text>
  <circle cx="342" cy="490" r="11" fill="#dce6ff"/>
  <text x="338" y="495" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2257d7">3</text>
  <text x="370" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#25313d">插件随后会自动读取 Windows 系统代理</text>
