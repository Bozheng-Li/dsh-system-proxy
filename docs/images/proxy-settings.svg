<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">开启系统代理并保持 TUN 关闭</title>
  <desc id="desc">示意图：代理软件启用系统代理，HTTP 端口为 7897，TUN 模式保持关闭。</desc>
  <rect width="1200" height="610" fill="#eef1f4"/>
  <rect x="44" y="34" width="1112" height="542" rx="14" fill="#ffffff" stroke="#d5dce3"/>
  <rect x="44" y="34" width="250" height="542" rx="14" fill="#f7f9fb"/>
  <path d="M294 34v542" stroke="#e1e6eb"/>
  <circle cx="80" cy="75" r="17" fill="#252e38"/>
  <path d="M74 75h12M80 69v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="109" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#18212b">代理软件</text>
  <rect x="66" y="120" width="206" height="44" rx="8" fill="#e8eefc"/>
  <text x="93" y="149" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#2257d7">系统代理</text>
  <text x="93" y="202" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#66717d">TUN 模式</text>
  <text x="93" y="244" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#66717d">规则 / 模式</text>
  <text x="328" y="91" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#18212b">系统代理</text>
  <text x="328" y="123" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#66717d">让 DSH 复用代理软件的本地 HTTP 端口</text>
  <rect x="328" y="165" width="760" height="96" rx="10" fill="#f8fafc" stroke="#e1e6eb"/>
  <text x="354" y="199" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#25313d">开启系统代理</text>
  <text x="354" y="229" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#6b7681">保持开启，插件会在 DSH 启动时读取此设置</text>
  <rect x="978" y="188" width="72" height="36" rx="18" fill="#238a5a"/>
  <circle cx="1032" cy="206" r="14" fill="#ffffff"/>
  <rect x="328" y="286" width="760" height="96" rx="10" fill="#f8fafc" stroke="#e1e6eb"/>
  <text x="354" y="320" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#25313d">TUN 模式</text>
  <text x="354" y="350" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#6b7681">不需要为 DSH 常开 TUN；保持关闭即可</text>
  <rect x="978" y="309" width="72" height="36" rx="18" fill="#dce2e8"/>
  <circle cx="996" cy="327" r="14" fill="#ffffff"/>
  <rect x="328" y="407" width="760" height="110" rx="10" fill="#fff8e8" stroke="#ecd9a7"/>
  <text x="354" y="443" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#70520d">确认 HTTP 端口</text>
  <text x="354" y="474" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#70520d">系统代理地址通常是 127.0.0.1:7897；请以代理软件显示为准</text>
  <rect x="818" y="434" width="228" height="48" rx="8" fill="#ffffff" stroke="#d9c48c"/>
  <text x="842" y="464" font-family="Consolas, monospace" font-size="18" fill="#3b3524">127.0.0.1:7897</text>
</svg>
