<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">安装后完成三步启用</title>
  <desc id="desc">流程图：确定系统代理已开启，完全退出 DSH，然后重新打开并使用。</desc>
  <rect width="1200" height="610" fill="#eef1f4"/>
  <rect x="44" y="34" width="1112" height="542" rx="14" fill="#ffffff" stroke="#d5dce3"/>
  <text x="86" y="112" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#18212b">安装完成后</text>
  <text x="86" y="146" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#66717d">插件需要随 DSH 重新启动一次，才能挂载到当前进程。</text>
  <circle cx="188" cy="301" r="78" fill="#e8eefc" stroke="#2257d7" stroke-width="2"/>
  <text x="154" y="289" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#2257d7">01</text>
  <text x="112" y="319" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#2257d7">开启系统代理</text>
  <path d="M281 301h128" stroke="#bfc9d3" stroke-width="3" stroke-linecap="round"/>
  <path d="M398 290l14 11-14 11" fill="none" stroke="#bfc9d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="485" cy="301" r="78" fill="#e8eefc" stroke="#2257d7" stroke-width="2"/>
  <text x="451" y="289" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#2257d7">02</text>
  <text x="421" y="319" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#2257d7">完全退出 DSH</text>
  <path d="M578 301h128" stroke="#bfc9d3" stroke-width="3" stroke-linecap="round"/>
  <path d="M695 290l14 11-14 11" fill="none" stroke="#bfc9d3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="301" r="78" fill="#2257d7"/>
  <text x="766" y="289" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#ffffff">03</text>
  <text x="742" y="319" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#ffffff">重新打开 DSH</text>
  <rect x="950" y="260" width="145" height="82" rx="10" fill="#eff8f2" stroke="#bcdcc8"/>
  <path d="M978 300l10 10 20-23" fill="none" stroke="#238a5a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1020" y="307" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#23744f">已启用</text>
  <rect x="86" y="426" width="1008" height="84" rx="10" fill="#f8fafc" stroke="#e1e6eb"/>
  <text x="113" y="458" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#25313d">排障顺序</text>
  <text x="113" y="486" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#66717d">系统代理开启  →  端口可连接  →  DSH 已完全退出并重启  →  没有显式代理环境变量覆盖</text>
</svg>
